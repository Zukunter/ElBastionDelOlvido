format = """
$username\
$fill\
$line_break\
$directory\
$line_break\
$character"""

[username]
show_always = true
format = """
[ ⁺✦₊ ](#D1902E)\
[](#D1902E)\
[](#D1902E)\
[  ](#D02F64)\
[](#D02F64)\
[](#D02F64)\
[ $user ](fg:#187A77 bold)\
[](#D02F64)\
[](#D02F64)\
[  ](#D02F64)\
[](#D1902E)\
[](#D1902E)\
[ ₊✦⁺ ](#D1902E) """

[directory]
style = "#187A77"
truncation_length = 1

[fill]
symbol = " "

[character]
success_symbol = "[==>](bold green)"
error_symbol = "[==>](bold red)"
