windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
windowrule {
  name = Browser's
  match:class = xdg-desktop-portal-gtk

  size = 700 400
  float = true
  pin = false
}
